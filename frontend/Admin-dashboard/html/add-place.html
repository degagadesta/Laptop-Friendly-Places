<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add New Place - Laptop Friendly Finder</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/add-place.css" />
  <link rel="stylesheet" href="../css/maps.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>
  <!-- Loading Screen -->
  <!-- <div id="loadingScreen">
      <div class="loader">
        <div class="loader-circle"></div>
        <div>Loading Add Place...</div>
      </div>
    </div> -->

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <!-- Logo -->
    <div class="sidebar-header">
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <i class="fas fa-laptop-code"></i>
        </div>
        <div class="logo-text">
          <h2>LFF Admin</h2>
          <p>Dashboard v1.0</p>
        </div>
      </a>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item">
        <i class="fas fa-tachometer-alt nav-icon"></i>
        <span>Dashboard</span>
      </a>

      <a href="places.html" class="nav-item">
        <i class="fas fa-map-marker-alt nav-icon"></i>
        <span>Places</span>
        <span class="nav-badge" id="placesBadge">0</span>
      </a>

      <a href="add-place.html" class="nav-item active">
        <i class="fas fa-plus-circle nav-icon"></i>
        <span>Add Place</span>
      </a>

      <a href="reported.html" class="nav-item">
        <i class="fas fa-flag nav-icon"></i>
        <span>Reported</span>
        <span class="nav-badge" id="reportedBadge">0</span>
      </a>

      <a href="contributors.html" class="nav-item">
        <i class="fas fa-users nav-icon"></i>
        <span>Contributors</span>
      </a>
    </nav>

    <!-- User Profile -->
    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="user-avatar">
          <i class="fas fa-user-shield"></i>
        </div>
        <div class="user-info">
          <h4 id="adminName">Admin User</h4>
          <p>Super Admin</p>
        </div>
        <button class="logout-btn" onclick="logout()" title="Logout">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="page-title">
        <h1 id="pageTitle">Add New Place</h1>
        <div class="breadcrumb" id="breadcrumb">
          <a href="index.html">Dashboard</a>
          <i class="fas fa-chevron-right"></i>
          <span id="breadcrumbCurrent">Add Place</span>
        </div>
      </div>

      <div class="top-actions">
        <button class="menu-toggle" onclick="toggleSidebar()">
          <i class="fas fa-bars"></i>
        </button>

        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="globalSearch" placeholder="Search..." />
        </div>

        <button class="btn-primary" onclick="refreshData()">
          <i class="fas fa-sync-alt"></i>
          Refresh
        </button>
      </div>
    </div>

    <!-- Content Area -->
    <div class="content-area">
      <!-- Add Place Section -->
      <section id="add-place" class="section active">
        <div class="section-header">
          <h2>Add New Place</h2>
          <p style="color: var(--gray-600)">
            Add a new laptop-friendly place to the system
          </p>
        </div>

        <!-- Map Location Picker Section -->
        <div class="form-container">
          <div class="form-group">
            <label for="mapContainer"><i class="fas fa-map-marker-alt"></i> Select Location on Map *</label>
            <div id="mapContainer"
              style="width: 100%; height: 400px; border-radius: 10px; overflow: hidden; margin-bottom: 10px;"></div>
            <p style="color: var(--gray-600); font-size: 14px; margin-top: 8px;">
              <i class="fas fa-info-circle"></i> Click anywhere on the map to set the location
            </p>
            <div id="selectedLocationInfo"
              style="display: none; margin-top: 15px; padding: 15px; background: var(--gray-100); border-radius: 8px;">
              <p style="margin: 5px 0;"><strong>Coordinates:</strong> <span id="selectedCoordinates"></span></p>
            </div>
          </div>
        </div>

        <!-- Add Place Form -->
        <div class="form-container" id="addPlaceFormContainer">
          <form id="addPlaceForm">
            <div class="form-group">
              <label for="placeName"><i class="fas fa-tag"></i> Place Name *</label>
              <input type="text" id="placeName" required placeholder="e.g., Tomoca Coffee" />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="placeType">Place Category *</label>
                <select id="placeCategory" required>
                  <option value="">Select Category</option>
                  <option value="cafe">Cafe</option>
                  <option value="restaurant">Restaurant</option>
                  <option value="hotel">Hotel</option>
                  <option value="library">Library</option>
                  <option value="coworking">Co-working Space</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>

            <!-- Hidden latitude and longitude fields -->
            <input type="hidden" id="latitude" value="" />
            <input type="hidden" id="longitude" value="" />

            <div class="form-row">
              <div class="form-group">
                <label for="wifiRating"><i class="fas fa-wifi"></i> WiFi Quality</label>
                <select id="wifiRating">
                  <option value="">Select</option>
                  <option value="5">Excellent</option>
                  <option value="4">Good</option>
                  <option value="3">Average</option>
                  <option value="2">Poor</option>
                  <option value="1">Very Poor</option>
                </select>
              </div>

              <div class="form-group">
                <label for="powerRating"><i class="fas fa-plug"></i> Power Outlets</label>
                <select id="powerRating">
                  <option value="">Select</option>
                  <option value="5">Excellent</option>
                  <option value="4">Good</option>
                  <option value="3">Average</option>
                  <option value="2">Limited</option>
                  <option value="1">None</option>
                </select>
              </div>

              <div class="form-group">
                <label for="serviceRating"><i class="fas fa-face-smile"></i> Customer Service</label>
                <select id="serviceRating">
                  <option value="">Select</option>
                  <option value="5">Excellent</option>
                  <option value="4">Good</option>
                  <option value="3">Average</option>
                  <option value="2">Poor</option>
                  <option value="1">Very Poor</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="description"><i class="fas fa-align-left"></i> Description</label>
              <textarea id="description" rows="3" placeholder="Tell us about this place..."></textarea>
            </div>

            <div class="form-group">
              <label for="imageFile"><i class="fas fa-images"></i> Image (Optional)</label>
              <input type="file" id="imageFile" accept="image/*" />
              <small style="color: var(--gray-600); font-size: 13px">PNG, JPG up to 5MB</small>
            </div>

            <div style="display: flex; gap: 15px; margin-top: 30px">
              <button type="submit" class="btn-primary" style="padding: 14px 30px">
                <i class="fas fa-plus"></i> Add Place
              </button>
              <button type="button" onclick="resetForm()" style="
                    padding: 14px 30px;
                    background: var(--gray-200);
                    color: var(--gray-700);
                    border: none;
                    border-radius: 10px;
                    cursor: pointer;
                  ">
                Reset Form
              </button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <!-- JavaScript Files -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script type="module" src="../js/add-place.js?v=3"></script>
</body>

</html>
