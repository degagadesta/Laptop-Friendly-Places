<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LFP</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="../assets/images/logo.svg" alt="LFP">
                <h1>LFP</h1>
                <p>Laptop Friendly Places</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <h2>Welcome Back</h2>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon">
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                        <i class="fa-regular fa-eye toggle" data-target="loginPassword"></i>
                    </div>
                </div>
                <div id="loginMsg" class="msg" style="display:none;padding:10px;border-radius:8px;margin-bottom:10px;">
                </div>
                <button type="submit" class="auth-btn">
                    <span class="btn-text">Sign In</span>
                    <span class="spinner" style="display:none;"><i class="fa-solid fa-spinner fa-spin"></i></span>
                </button>
                <p class="switch-text">Don't have an account? <a href="#" id="showSignup">Sign Up</a></p>
            </form>

            <!-- Sign Up Form -->
            <form id="signupForm" class="auth-form">
                <h2>Create Account</h2>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signupName" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon">
                        <input type="password" id="signupPassword" placeholder="Min 8 chars, A-Z, 0-9" required>
                        <i class="fa-regular fa-eye toggle" data-target="signupPassword"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="signupConfirm" placeholder="Repeat password" required>
                </div>
                <div id="message" class="msg" style="display:none;padding:10px;border-radius:8px;margin-bottom:10px;">
                </div>
                <button type="submit" class="auth-btn">
                    <span class="btn-text">Create Account</span>
                    <span class="spinner" style="display:none;"><i class="fa-solid fa-spinner fa-spin"></i></span>
                </button>
                <p class="switch-text">Already have an account? <a href="#" id="showLogin">Sign In</a></p>
            </form>
        </div>
    </div>
    <script type="module" src="../js/login.js"></script>
</body>

</html>
